# Inventory used by the self-healing platform.
#
# The bundled simulator exposes three virtual hosts (web-01, api-01, db-01) so
# the recovery playbooks can be exercised without physical machines. Point
# these entries at real machines and set SHIP_ANSIBLE_DRY_RUN=false to execute
# recovery for real.
#
# NEVER store passwords or private keys in this file. Use SSH keys or a vault.

[web]
web-01 ansible_host=10.10.0.11 ansible_user=ubuntu service_name=nginx.service

[api]
api-01 ansible_host=10.10.0.12 ansible_user=ubuntu service_name=ship-api.service

[db]
db-01 ansible_host=10.10.0.13 ansible_user=ubuntu service_name=postgresql.service

[nodes:children]
web
api
db

[nodes:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
recovery_mode=automated
recovery_log_dir=/var/log/self-healing
log_retention_days=14
service_health_timeout=30
