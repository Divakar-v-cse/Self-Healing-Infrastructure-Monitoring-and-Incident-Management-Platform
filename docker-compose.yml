name: self-healing-infra

# Development / demo stack.
#
#   docker compose up -d --build
#
#   Platform UI      http://localhost:8080
#   API + docs       http://localhost:8000/docs
#   Grafana          http://localhost:3000      (admin / admin by default)
#   Prometheus       http://localhost:9090
#   Alertmanager     http://localhost:9093
#   Simulator        http://localhost:9101/sim/hosts
#
# Credentials come from .env (see .env.example). Nothing is hard-coded here.

services:
  simulator:
    build:
      context: ./simulator
    container_name: ship-simulator
    environment:
      SIM_PORT: "9101"
    ports:
      - "9101:9101"
    networks: [monitoring]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ship-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
      - simulator
    networks: [monitoring]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ship-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [monitoring]
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ship-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "9115:9115"
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ship-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infrastructure-health.json
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [monitoring]
    restart: unless-stopped

  ship-backend:
    build:
      context: ./backend
    container_name: ship-backend
    environment:
      SHIP_ENVIRONMENT: ${SHIP_ENVIRONMENT:-development}
      SHIP_DATABASE_URL: sqlite:////data/ship.db
      SHIP_PROMETHEUS_URL: http://prometheus:9090
      SHIP_ALERTMANAGER_URL: http://alertmanager:9093
      SHIP_SIMULATOR_URL: http://simulator:9101
      SHIP_ENABLE_MONITOR_LOOP: ${SHIP_ENABLE_MONITOR_LOOP:-true}
      SHIP_MONITOR_INTERVAL_SECONDS: ${SHIP_MONITOR_INTERVAL_SECONDS:-30}
      SHIP_RECOVERY_ENABLED: ${SHIP_RECOVERY_ENABLED:-true}
      SHIP_ANSIBLE_ENABLED: ${SHIP_ANSIBLE_ENABLED:-true}
      SHIP_ANSIBLE_DRY_RUN: ${SHIP_ANSIBLE_DRY_RUN:-true}
      SHIP_ANSIBLE_DRY_RUN_ACK: "set SHIP_ANSIBLE_DRY_RUN=false to execute recovery for real"
      SHIP_MAX_ATTEMPTS_PER_INCIDENT: ${SHIP_MAX_ATTEMPTS_PER_INCIDENT:-3}
      SHIP_RECOVERY_COOLDOWN_SECONDS: ${SHIP_RECOVERY_COOLDOWN_SECONDS:-300}
      SHIP_CIRCUIT_BREAKER_THRESHOLD: ${SHIP_CIRCUIT_BREAKER_THRESHOLD:-3}
      SHIP_MAX_CONCURRENT_RECOVERIES: ${SHIP_MAX_CONCURRENT_RECOVERIES:-2}
      SHIP_INCIDENT_AUTORESOLVE_MINUTES: ${SHIP_INCIDENT_AUTORESOLVE_MINUTES:-10}
      SHIP_LOG_LEVEL: ${SHIP_LOG_LEVEL:-INFO}
      SHIP_CORS_ORIGINS: ${SHIP_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      - ship-data:/data
      - ./ansible:/ansible:ro
    ports:
      - "8000:8000"
    depends_on:
      prometheus:
        condition: service_started
      simulator:
        condition: service_started
    networks: [monitoring]
    restart: unless-stopped

  ship-frontend:
    build:
      context: ./frontend
    container_name: ship-frontend
    ports:
      - "8080:80"
    depends_on:
      - ship-backend
    networks: [monitoring]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  ship-data:

networks:
  monitoring:
    driver: bridge
